server:
  port: 10010

spring:
  application:
    name: mall-gateway
  cloud:
    nacos:
      discovery:
        # 注册中心地址：容器内由环境变量注入 nacos:8848，本地默认 127.0.0.1:8848
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

mall:
  token:
    # JWT 签名密钥：生产环境必须通过 MALL_TOKEN_SECRET 注入；占位值仅用于本地跑通演示
    secret: ${MALL_TOKEN_SECRET:change-me-jwt-secret}
  # 全局请求验签密钥：与前端 VITE_SIGN_SECRET 必须完全一致，否则所有 POST 请求 403
  # 生产环境必须通过 MALL_SIGN_SECRET 注入为随机长字符串，切勿使用占位值
  sign:
    secret: ${MALL_SIGN_SECRET:change-me-sign-secret}
  # 下游服务地址：经 Nacos 服务发现 + 客户端负载均衡（lb://服务名）
  routes:
    mgr-uri: lb://mall-mgr
    alipay-uri: lb://mall-alipay

logging:
  level:
    com.mall: info